appId: io.github.exatasmente.coxia
productName: Coxia
# The executable, and so the desktop file and window class (syncDesktopName), keep their original name on purpose: a launcher or an autostart entry
# made by an earlier version points at it. The runtime app name and the data folders stay `cerimonias` too (src/main/index.ts pins them).
executableName: cerimonias
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
asarUnpack:
  # The SDK's native Claude Code binary must be a real file to be executed.
  - node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/**
  # The app's browser runs the Playwright MCP server (cli.js) with the app's own executable in Node mode, so it and the Playwright core it carries (nested under it,
  # a different version from the repository's own dev dependency) must be real files. src/main/paths.ts reads them from app.asar.unpacked.
  - node_modules/@playwright/**
  - node_modules/@playwright/mcp/node_modules/playwright-core/**
  # In the package the server's own Playwright is hoisted next to it (the repository's playwright-core is a dev dependency and stays out),
  # and Node does not look inside app.asar from app.asar.unpacked: what cli.js requires must be unpacked too.
  - node_modules/playwright/**
  - node_modules/playwright-core/**
extraResources:
  - from: resources
    to: resources
  - from: sidecar
    to: sidecar
    filter:
      - voice_sidecar.py
      - voice_fetch.py
      - requirements.txt
  - from: plugins
    to: plugins
linux:
  icon: resources/icon.png
  category: Office
  maintainer: Luiz Neto <22161417+exatasmente@users.noreply.github.com>
  synopsis: Cerimônias por voz com agentes por atividade
  syncDesktopName: true
  target:
    - AppImage
    - deb
deb:
  packageName: coxia
  artifactName: coxia_${version}_amd64.${ext}
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
appImage:
  artifactName: coxia-${version}.${ext}
# Where a published build looks for updates: electron-builder writes this into the app as resources/app-update.yml and electron-updater
# reads it. `npm run dist` never uploads anything; the release workflow does (RELEASING.md). Another repository (a fork): change owner and
# repo here, or pass -c.publish.owner=... -c.publish.repo=... to electron-builder.
publish:
  provider: github
  owner: exatasmente
  repo: coxia
  releaseType: draft
# Windows and macOS are wired for updates but are not part of `npm run dist` and are not code signed yet: automatic updates there only
# work with signed builds (docs/updates.md).
win:
  target:
    - nsis
# Named like the Linux files; the release workflow checks the draft for this name.
nsis:
  artifactName: coxia-setup-${version}.${ext}
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
