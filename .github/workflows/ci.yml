name: CI

# main and the open release branches (release/X.Y.Z, RELEASING.md): a pull request into a release branch is checked like one into main.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Nothing of a company or a person in the tree (names, hosts, private addresses, emails, secrets): scripts/public-audit.mjs.
      - name: Public audit
        run: node scripts/public-audit.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Theme audit
        run: node scripts/theme-audit.mjs

      - name: i18n lint
        run: npm run i18n:lint

      - name: Build
        run: npx electron-vite build

  windows-package:
    name: Windows NSIS package
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the unsigned Windows installer
        run: |
          npx electron-vite build
          npx electron-builder --config electron-builder.public.yml --win nsis --publish never

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.blockmap
            !dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

# The Python voice sidecar (sidecar/voice_sidecar.py) is not part of CI: it needs the faster-whisper and Kokoro models and a local audio
# stack, and it has no automated tests of its own.
