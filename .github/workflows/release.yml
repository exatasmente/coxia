name: Release

# A tag v<major>.<minor>.<patch>[-suffix] builds the PUBLIC packages (no Claude Agent SDK inside, see electron-builder.public.yml) and
# uploads them to a DRAFT GitHub release. Nothing is visible to the apps until a person publishes the draft (RELEASING.md).
# A suffix (-beta.1) makes it a pre-release on that update channel: the feed is beta-linux.yml instead of latest-linux.yml, which is what
# the app reads when "Beta" is chosen in Settings.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and check the packages, upload them as workflow artifacts, create no release'
        type: boolean
        default: true
      experimental_platforms:
        description: 'Also build macOS (dmg, zip). UNSIGNED and untested: automatic updates there need code signing. Windows is built on every run'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Never let electron-builder go looking for signing identities or publish from a pull request.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the branches, to check that the tag's commit is on one

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Match the tag with package.json
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"
            dry_run=false
          else
            tag="v$version"
            dry_run="$DRY_RUN_INPUT"
            if [ "$dry_run" != true ] && [ "$REF" != refs/heads/main ]; then
              echo "::error::a real release started by hand must run from main, not from $REF"
              exit 1
            fi
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::the tag is $tag but package.json says $version: run scripts/release.sh, or fix the version and re-tag"
            exit 1
          fi
          prerelease=false
          channel=latest
          case "$version" in
            *-*) prerelease=true; pre="${version#*-}"; channel="${pre%%.*}" ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version, channel $channel, prerelease: $prerelease, dry run: $dry_run)"

      # A stable tag must sit on a commit of origin/main and a beta on one of origin/release/<version>: a tag from a local-only or stale commit publishes what no
      # branch carries (RELEASING.md: push the branch first, then the tag).
      - name: Check that the tag's commit is on its branch
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: scripts/verify-release-origin.sh "$VERSION" "$GITHUB_SHA"

  # ---- The draft: made once, before any build ------------------------------------------------------------------------------------------
  # Every platform job uploads into this one draft, so they build at the same time: each electron-builder finds the draft by its tag instead of
  # making its own. A real release only; a dry run creates nothing and the platform jobs run without it.
  draft:
    name: Make the draft release
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the draft release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release notes from CHANGELOG.md
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if scripts/release-notes.sh "$VERSION" > release-notes.md; then
            echo "Using the CHANGELOG.md entry for $VERSION"
          elif [ "$PRERELEASE" = true ]; then
            echo "::warning::CHANGELOG.md has no entry for $VERSION; using a one-line note"
            printf 'Pre-release %s. See CHANGELOG.md for what changed.\n' "$TAG" > release-notes.md
          else
            echo "::error::CHANGELOG.md has no entry for $VERSION: a final release needs one (scripts/release.sh writes it)"
            exit 1
          fi

      - name: Make the draft, linked to its tag, a pre-release when the version has a suffix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A re-run finds the draft its first attempt made, by name: a second draft would split the files between the two.
          id="$(gh api "repos/$REPOSITORY/releases" --paginate --jq '.[] | select(.draft and (.name == $ENV.TAG or .tag_name == $ENV.TAG)) | .id' | sed -n 1p)"
          if [ -z "$id" ]; then
            id="$(gh api --method POST "repos/$REPOSITORY/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=true -F prerelease="$PRERELEASE" -f body="$(cat release-notes.md)" --jq '.id')"
          fi
          # GitHub has answered a draft with tag_name "untagged-<hash>" and target_commitish main (v0.5.0-beta.2): publishing that draft would
          # create a tag literally named untagged-<hash> on main's head instead of linking the pushed tag. So tag_name is set again, and checked.
          linked="$(gh api --method PATCH "repos/$REPOSITORY/releases/$id" -f tag_name="$TAG" -F prerelease="$PRERELEASE" --jq '.tag_name')"
          [ "$linked" = "$TAG" ] || { echo "::error::the draft release is linked to the tag $linked, not $TAG"; exit 1; }
          echo "draft $id: tag_name=$linked prerelease=$PRERELEASE"

  linux:
    name: Linux (AppImage and deb)
    needs: [prepare, draft]
    # The draft job is skipped in a dry run: that is not a failure.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # uploads the files to the draft
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release notes from CHANGELOG.md
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if scripts/release-notes.sh "$VERSION" > release-notes.md; then
            echo "Using the CHANGELOG.md entry for $VERSION"
          elif [ "$PRERELEASE" = true ]; then
            echo "::warning::CHANGELOG.md has no entry for $VERSION; using a one-line note"
            printf 'Pre-release %s. See CHANGELOG.md for what changed.\n' "$TAG" > release-notes.md
          else
            echo "::error::CHANGELOG.md has no entry for $VERSION: a final release needs one (scripts/release.sh writes it)"
            exit 1
          fi

      - name: Build the public packages (dry run, nothing is published)
        if: needs.prepare.outputs.dry_run == 'true'
        run: >
          npm run dist:public --
          --publish never
          -c.publish.channel="$CHANNEL"
          -c.releaseInfo.releaseNotesFile=release-notes.md

      - name: Build the public packages and upload them to the draft release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: >
          npm run dist:public --
          --publish always
          -c.publish.channel="$CHANNEL"
          -c.publish.owner="$OWNER"
          -c.publish.repo="$REPO"
          -c.releaseInfo.releaseName="$TAG"
          -c.releaseInfo.releaseNotesFile=release-notes.md

      - name: Check the files
        run: scripts/verify-release-files.sh "$VERSION" dist

      - name: Check what the draft release holds
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          feed="$CHANNEL-linux.yml"
          # By name, as the draft job does: GitHub may show the draft as untagged-<hash>. The newest one wins (the API lists newest first).
          id="$(gh api "repos/$REPOSITORY/releases" --paginate --jq '.[] | select(.draft and (.name == $ENV.TAG or .tag_name == $ENV.TAG)) | .id' | sed -n 1p)"
          [ -n "$id" ] || { echo "::error::no draft release named $TAG"; exit 1; }
          # Publishing creates the tag named in tag_name when it does not exist: anything but $TAG would put a stray tag on the draft's target.
          tag_name="$(gh api "repos/$REPOSITORY/releases/$id" --jq '.tag_name')"
          [ "$tag_name" = "$TAG" ] || { echo "::error::the draft release is linked to the tag $tag_name, not $TAG: publishing it would create $tag_name"; exit 1; }
          assets="$(gh api "repos/$REPOSITORY/releases/$id" --jq '.assets[].name')"
          echo "$assets"
          for want in "coxia-$VERSION.AppImage" "coxia_${VERSION}_amd64.deb" "$feed"; do
            echo "$assets" | grep -qxF "$want" || { echo "::error::the draft release is missing $want"; exit 1; }
          done
          # The feed belongs to one channel: a pre-release must not carry latest-linux.yml (it would move everyone on the stable channel), and a final
          # release must not carry another channel's feed.
          other="$(echo "$assets" | grep -E -- '-linux\.yml$' | grep -vxF "$feed" || true)"
          [ -z "$other" ] || { echo "::error::the draft release carries a feed of another channel: $other"; exit 1; }

      - name: Keep the packages as a workflow artifact (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

  # ---- Windows: on every tag, unsigned -----------------------------------------------------------------------------------------------
  # The NSIS installer is built for every tag, alongside the Linux files, and attached to the same draft the draft job made. It is UNSIGNED:
  # Windows shows a SmartScreen warning and automatic updates may be blocked until code signing is configured (docs/updates.md). The feed is the
  # channel's own (latest.yml, or beta.yml for a beta), so a beta never moves the Windows installs on the stable channel.
  windows:
    name: Windows NSIS (unsigned)
    needs: [prepare, draft]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ needs.prepare.outputs.dry_run == 'true' && 'never' || 'always' }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        # The release name is the tag, as in the Linux job: electron-builder then uploads into the draft the draft job linked to the tag instead of making another.
        run: |
          npx electron-vite build
          npx electron-builder --config electron-builder.public.yml --win nsis --publish "$PUBLISH" -c.publish.channel="$CHANNEL" -c.publish.owner="$OWNER" -c.publish.repo="$REPO" -c.releaseInfo.releaseName="$TAG"

      - name: Check the Windows files in the draft release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          drafts="$(gh api "repos/$REPOSITORY/releases" --paginate --jq '.[] | select(.draft and (.name == $ENV.TAG or .tag_name == $ENV.TAG)) | .id')"
          [ "$(echo "$drafts" | grep -c .)" = 1 ] || { echo "::error::expected one draft release named $TAG, found: $drafts"; exit 1; }
          assets="$(gh api "repos/$REPOSITORY/releases/$drafts" --jq '.assets[].name')"
          echo "$assets"
          for want in "coxia-setup-$VERSION.exe" "coxia-setup-$VERSION.exe.blockmap" "$CHANNEL.yml"; do
            echo "$assets" | grep -qxF "$want" || { echo "::error::the draft release is missing $want"; exit 1; }
          done
          # Like the Linux feeds: a pre-release must not carry latest.yml (it would move every Windows install on the stable channel).
          other="$(echo "$assets" | grep -E '^[a-z]+\.yml$' | grep -vxF "$CHANNEL.yml" || true)"
          [ -z "$other" ] || { echo "::error::the draft release carries a Windows feed of another channel: $other"; exit 1; }

      - name: Keep the files as a workflow artifact (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

  # ---- macOS: optional, off by default -------------------------------------------------------------------------------------------------
  # UNSIGNED and untested: electron-updater on macOS refuses unsigned builds, so automatic updates there only work once code signing is configured
  # (docs/updates.md). Attached to the same draft release when asked for.
  macos:
    name: macOS dmg and zip (experimental, unsigned)
    needs: [prepare, draft]
    if: ${{ !failure() && !cancelled() && inputs.experimental_platforms == true }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ needs.prepare.outputs.dry_run == 'true' && 'never' || 'always' }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          npx electron-vite build
          npx electron-builder --config electron-builder.public.yml --mac dmg zip --publish "$PUBLISH" -c.publish.owner="$OWNER" -c.publish.repo="$REPO"

      - name: Keep the files as a workflow artifact (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-packages-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 7
