# The build published on GitHub Releases (npm run dist:public, .github/workflows/release.yml). It extends electron-builder.yml and differs in one
# thing: the Claude Agent SDK (proprietary, Anthropic's terms) is left out of the package, because the setup wizard installs it on the
# first run (src/main/claudeSdk.ts notices the missing binary and reports the SDK as not installed).
# `npm run dist` (your own build from source) keeps using electron-builder.yml and bundles the SDK.
extends: ./electron-builder.yml
files:
  - out/**
  - package.json
  - "!node_modules/@anthropic-ai/**"
# A list here replaces the base's, so the SDK's binary (left out of this package) drops out and the Playwright MCP server of the app's browser stays unpacked.
asarUnpack:
  - node_modules/@playwright/**
  - node_modules/@playwright/mcp/node_modules/playwright-core/**
  # In the package the server's own Playwright is hoisted next to it (the repository's playwright-core is a dev dependency and stays out),
  # and Node does not look inside app.asar from app.asar.unpacked: what cli.js requires must be unpacked too.
  - node_modules/playwright/**
  - node_modules/playwright-core/**
